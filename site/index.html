<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%2339d98a%22/%3E%3C/svg%3E">
<title>LED Matrix Playground</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span>embedded-compose <span class="sub">LED matrix playground</span></div>
  <label class="field">Example
    <select id="example"></select>
  </label>
  <button id="reset" class="ghost" title="Undo your edits to this example">Reset</button>
  <div class="grow"></div>
  <span id="status" class="status">loading…</span>
  <button id="run" class="primary" title="Compile and run (Ctrl+Enter)">▶ Run</button>
</header>

<main>
  <section class="editor-pane">
    <div class="tabs" id="tabs"></div>
    <div class="editor" id="editor"></div>
  </section>

  <section class="sim-pane">
    <div class="sim-toolbar">
      <label class="field">Panel
        <select id="panel">
          <option value="hub75">HUB75</option>
          <option value="max7219">MAX7219</option>
        </select>
      </label>
      <label class="field">Size
        <select id="size"></select>
      </label>
      <div class="grow"></div>
      <span id="fps" class="muted"></span>
      <button id="restart" class="ghost" title="Start the app again">Restart</button>
      <button id="snapshot" class="ghost" title="Save the panel as a PNG">Snapshot</button>
    </div>
    <div class="bezel" id="bezel">
      <iframe id="sim" title="LED panel" src="about:blank"></iframe>
      <div class="overlay" id="overlay" hidden></div>
    </div>
    <div class="keys" id="keys">
      <button data-key="105" title="Left">◀</button>
      <button data-key="103" title="Up">▲</button>
      <button data-key="108" title="Down">▼</button>
      <button data-key="106" title="Right">▶</button>
      <button data-key="28" class="wide" title="Enter">Enter</button>
      <span class="muted hint">or click the panel and use the keyboard; clicks are touches</span>
    </div>
    <div class="console-head">
      <span>Console</span>
      <button id="clear" class="ghost small">Clear</button>
    </div>
    <div class="console" id="console"></div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script type="module" src="playground.js"></script>
</body>
</html>
